# Decap CMS Configuration for SilverZone
# Docs: https://decapcms.org/docs/configuration-options/

backend:
  name: git-gateway
  branch: main

# Enable Media / Image uploads
media_folder: "images"
public_folder: "/images"

# Show publish confirmation
publish_mode: editorial_workflow

locale: es

collections:
  - name: "productos"
    label: "Productos"
    label_singular: "Producto"
    description: "Agrega, edita o elimina productos del catálogo de SilverZone."
    folder: "_products"
    create: true
    slug: "{{fields.id}}"
    identifier_field: name
    fields:
      - label: "Nombre del Producto"
        name: "name"
        widget: "string"
        hint: "Ej: Anillo Óvalo Solitario"

      - label: "SKU / Código"
        name: "id"
        widget: "string"
        hint: "Código del proveedor. Ej: MSR3538SL"

      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - { label: "Anillos",   value: "anillos" }
          - { label: "Collares",  value: "collares" }
          - { label: "Aretes",    value: "aretes" }
          - { label: "Pulseras",  value: "pulseras" }
          - { label: "Cadenas",   value: "cadenas" }

      - label: "Forma de la Piedra"
        name: "shape"
        widget: "string"
        hint: "Ej: Óvalo, Redondo, Esmeralda, Corazón"

      - label: "Piedra y Claridad"
        name: "stone"
        widget: "string"
        default: "Moissanite VVS D/E"
        hint: "Ej: Moissanite VVS D/E · 2ct"

      - label: "Material"
        name: "material"
        widget: "string"
        default: "Plata Esterlina 925"

      - label: "Tallas / Tamaños Disponibles"
        name: "sizes"
        widget: "string"
        hint: "Ej: Tallas 6–9 · consultar disponibilidad"

      - label: "Descripción"
        name: "description"
        widget: "text"
        hint: "Descripción corta del producto para el catálogo."

      - label: "Foto del Producto"
        name: "image"
        widget: "image"
        required: false
        hint: "Sube la foto del producto. Tamaño recomendado: 600×750px."

      - label: "Destacado"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Marca si este producto debe aparecer con la etiqueta 'Destacado'."

  - name: "configuracion"
    label: "Configuración"
    files:
      - label: "Información General"
        name: "general"
        file: "data/config.json"
        fields:
          - label: "Número de WhatsApp"
            name: "whatsapp"
            widget: "string"
            hint: "Con código de país, sin + ni espacios. Ej: 18295551234"

          - label: "Tagline del Hero"
            name: "hero_tagline"
            widget: "string"
            default: "Moissanite en plata esterlina 925 — el brillo de un diamante, la durabilidad de la ciencia, a un precio que se merece."

          - label: "Texto del Botón Principal"
            name: "hero_cta"
            widget: "string"
            default: "Ver Colección"
